<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.4; }
        50% { transform: translateY(-20px) scale(1.15); opacity: 0.8; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      @keyframes shieldPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      .particle { animation: floatParticle 6s ease-in-out infinite; }
      .p1 { animation-delay: 0s; }
      .p2 { animation-delay: 2s; }
      .p3 { animation-delay: 4s; }
      .glow-bg { animation: pulseGlow 4s ease-in-out infinite; }
      .shield-icon { transform-origin: center; animation: shieldPulse 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Dynamic Glowing Orbs in Background (behind text) -->
  <circle cx="200" cy="100" r="140" fill="#6366f1" opacity="0.15" class="glow-bg"/>
  <circle cx="1000" cy="260" r="160" fill="#a855f7" opacity="0.15" class="glow-bg"/>
  <circle cx="600" cy="180" r="220" fill="#0284c7" opacity="0.1" class="glow-bg"/>

  <!-- Geometric Grid Accent Lines (Background) -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
  </g>

  <!-- Dynamic Floating Decorative Particles (Background Layer) -->
  <g class="particle p1">
    <circle cx="150" cy="240" r="6" fill="#38bdf8"/>
    <circle cx="1050" cy="80" r="8" fill="#c084fc"/>
  </g>
  <g class="particle p2">
    <circle cx="280" cy="70" r="8" fill="#818cf8"/>
    <circle cx="920" cy="290" r="5" fill="#38bdf8"/>
  </g>
  <g class="particle p3">
    <circle cx="820" cy="100" r="7" fill="#a855f7"/>
    <circle cx="220" cy="300" r="4" fill="#818cf8"/>
  </g>

  <!-- Central Shield Graphic (Security / Identity Theme) -->
  <g class="shield-icon" transform="translate(600, 75)">
    <path d="M 0 -45 L 35 -25 V 15 C 35 40 0 55 0 55 C 0 55 -35 40 -35 15 V -25 Z" fill="url(#accentGrad)" stroke="#818cf8" stroke-width="2.5" filter="url(#glow)"/>
    <path d="M -12 2 L -3 11 L 14 -8" stroke="#38bdf8" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Foreground Title and Subtitle -->
  <text x="600" y="185" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="38" fill="url(#titleGrad)" letter-spacing="1">
    Awesome Customer Identity &amp; Access Management
  </text>
  
  <text x="600" y="225" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="22" fill="#e2e8f0" letter-spacing="0.5">
    (CIAM)
  </text>

  <text x="600" y="270" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#94a3b8">
    Curated SaaS Platforms, Enterprise Solutions &amp; Open-Source Identity Engines
  </text>

  <!-- Subtle Bottom Border Accent -->
  <rect x="0" y="354" width="1200" height="6" fill="url(#titleGrad)"/>
</svg>
